[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iphone-mirror-mcp"
dynamic = ["version"]
description = "Local MCP server that reads and drives iPhone Mirroring on macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "iphone", "macos", "automation"]
classifiers = [
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyobjc-framework-Cocoa==12.2.2",
    "pyobjc-framework-Quartz==12.2.2",
    "pyobjc-framework-Vision==12.2.2",
    "pyobjc-framework-ApplicationServices==12.2.2",
]

[project.urls]
Homepage = "https://github.com/Vist233/iphone-mirror-mcp"
Repository = "https://github.com/Vist233/iphone-mirror-mcp"
Issues = "https://github.com/Vist233/iphone-mirror-mcp/issues"

[tool.hatch.version]
path = "src/iphone_mirror_mcp/__init__.py"

[project.scripts]
iphone-mirror-mcp = "iphone_mirror_mcp.server:main"
mirror-driver = "iphone_mirror_mcp.driver:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/iphone_mirror_mcp"]
